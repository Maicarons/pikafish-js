name: Release WASM assets

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Emscripten 3.1.74
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.74
          actions-cache-folder: emsdk-cache

      - name: Install dependencies
        run: npm ci

      - name: Build the three WASM variants
        run: npm run build:wasm

      - name: Package release assets
        run: npm run package:wasm

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" dist/release/* --clobber
          else
            gh release create "${{ github.ref_name }}" dist/release/* \
              --title "pikafish-js ${{ github.ref_name }}" \
              --notes "Prebuilt Pikafish WebAssembly variants and SHA256SUMS."
          fi
